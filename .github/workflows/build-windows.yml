name: Build CircuitAI (Windows - Recoil Engine)

on:
  push:
    branches: [ barbarian-apex, master, main ]
  pull_request:
    branches: [ barbarian-apex, master, main ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows x64 Native AI
    runs-on: windows-latest

    steps:
      - name: Checkout CircuitAI (barbarian-apex)
        uses: actions/checkout@v4
        with:
          path: CircuitAI

      - name: Checkout Recoil Engine
        uses: actions/checkout@v4
        with:
          repository: beyond-all-reason/spring
          ref: master
          path: recoil
          submodules: recursive

      - name: Checkout Recoil MinGW Dependencies
        uses: actions/checkout@v4
        with:
          repository: beyond-all-reason/mingwlibs64
          ref: master
          path: recoil/mingwlibs64

      - name: Setup MSYS2 and MinGW-w64 Toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-python
            gawk
            p7zip

      - name: Inject Apex AI into Recoil Engine
        shell: msys2 {0}
        run: |
          echo "Injecting Apex AI into Recoil AI/Skirmish/Apex and AI/Skirmish/CircuitAI..."
          rm -rf recoil/AI/Skirmish/Apex recoil/AI/Skirmish/CircuitAI
          mkdir -p recoil/AI/Skirmish/Apex recoil/AI/Skirmish/CircuitAI
          cp -r CircuitAI/* recoil/AI/Skirmish/Apex/
          cp -r CircuitAI/* recoil/AI/Skirmish/CircuitAI/

          echo "Disabling full engine & standalone tools to build AI only..."
          python3 -c "
          with open('recoil/CMakeLists.txt', 'r') as f:
              lines = f.readlines()
          with open('recoil/CMakeLists.txt', 'w') as f:
              for line in lines:
                  if line.strip() in ['add_subdirectory(tools)', 'add_subdirectory(doc)', 'add_subdirectory(cont)', 'add_subdirectory(rts)']:
                      f.write('# ' + line)
                  else:
                      f.write(line)
          "

          ls -la recoil/AI/Skirmish/Apex

      - name: Configure CMake
        shell: msys2 {0}
        run: |
          cd recoil
          mkdir -p build
          cd build
          cmake .. -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DAI_TYPES=NATIVE \
            -DCIRCUIT_DEBUG=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTING=OFF

      - name: Compile Apex Target
        shell: msys2 {0}
        run: |
          cd recoil/build
          ninja Apex -v

      - name: Package AI Artifacts
        shell: msys2 {0}
        run: |
          mkdir -p package/Apex/stable/data
          
          # Find and copy generated SkirmishAI.dll
          find recoil/build/AI/Skirmish/Apex -name "SkirmishAI.dll" -exec cp -v {} package/Apex/stable/ \; || \
          find recoil/AI/Skirmish/Apex -name "SkirmishAI.dll" -exec cp -v {} package/Apex/stable/ \; || true
          
          # Copy AI data configs and scripts
          cp -r CircuitAI/data/* package/Apex/stable/data/ 2>/dev/null || true
          cp CircuitAI/data/AIInfo.lua package/Apex/stable/ 2>/dev/null || true
          cp CircuitAI/data/AIOptions.lua package/Apex/stable/ 2>/dev/null || true
          cp CircuitAI/VERSION package/Apex/stable/ 2>/dev/null || true
          cp CircuitAI/README.md package/Apex/stable/ 2>/dev/null || true
          cp CircuitAI/LICENSE package/Apex/stable/ 2>/dev/null || true
          
          # Also place in root of package for convenience
          cp package/Apex/stable/SkirmishAI.dll package/Apex/ 2>/dev/null || true
          cp -r package/Apex/stable/data package/Apex/ 2>/dev/null || true
          cp package/Apex/stable/AIInfo.lua package/Apex/ 2>/dev/null || true
          cp package/Apex/stable/AIOptions.lua package/Apex/ 2>/dev/null || true
          
          echo "Listing packaged files in package/Apex:"
          ls -laR package/Apex

      - name: Upload Windows AI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Apex-windows-x64
          path: package/Apex
